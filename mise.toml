[settings]
# The tasks only need Nix; do not install the global tools before running one.
task.run_auto_install = false

[tasks.apply]
description = "Build and activate the configuration"
run = '''
case "$(uname)" in
  Darwin) sudo nix run --inputs-from . nix-darwin -- switch --flake .#mac ;;
  Linux) nix run --inputs-from . home-manager -- switch --impure -b hm-backup --flake .#linux ;;
  *) echo "unsupported OS: $(uname)" >&2; exit 1 ;;
esac
'''

[tasks.build]
description = "Build the configuration without activating it"
run = '''
case "$(uname)" in
  Darwin) nix run --inputs-from . nix-darwin -- build --flake .#mac ;;
  Linux) nix run --inputs-from . home-manager -- build --impure --flake .#linux ;;
  *) echo "unsupported OS: $(uname)" >&2; exit 1 ;;
esac
'''

[tasks.diff]
description = "Show the package changes between the active generation and ./result"
run = '''
case "$(uname)" in
  Darwin) nix store diff-closures /run/current-system ./result ;;
  Linux) nix store diff-closures "$HOME/.local/state/nix/profiles/home-manager" ./result ;;
  *) echo "unsupported OS: $(uname)" >&2; exit 1 ;;
esac
'''

[tasks.update]
description = "Update the flake inputs in flake.lock"
run = "nix flake update"

[tasks.upgrade]
description = "Upgrade everything with topgrade, configured in nix/home/topgrade.nix"
run = "topgrade"

[tasks.lock]
description = "Commit flake.lock and config/nvim/lazy-lock.json if they changed"
run = "git diff --quiet HEAD -- flake.lock config/nvim/lazy-lock.json || git commit -m 'chore: update lock files' -- flake.lock config/nvim/lazy-lock.json"

[tasks."upgrade:nix"]
description = "Update the flake inputs and activate the result; a failing build restores flake.lock"
run = [
  { task = "update" },
  "mise run build || { git restore flake.lock; exit 1; }",
  { task = "diff" },
  { task = "apply" },
]

[tasks.gc]
description = "Delete generations (and, on macOS, Homebrew downloads) older than 7 days, then collect garbage"
run = '''
case "$(uname)" in
  Darwin) sudo nix-collect-garbage --delete-older-than 7d && brew cleanup --prune=7 ;;
  Linux) nix-collect-garbage --delete-older-than 7d ;;
  *) echo "unsupported OS: $(uname)" >&2; exit 1 ;;
esac
'''

[tasks.fmt]
description = "Format all Nix files"
run = "nix fmt"

[tasks.check]
description = "Evaluate the flake outputs"
run = "nix flake check --impure"

[tasks.pre-commit]
description = "Fail if any Nix file is not formatted"
run = "nix fmt -- --ci"
