[tasks.apply]
description = "Build and activate the system configuration"
run = "sudo nix run --inputs-from . nix-darwin -- switch --flake .#Ree"

[tasks.build]
description = "Build the system configuration without activating it"
run = "nix run --inputs-from . nix-darwin -- build --flake .#Ree"

[tasks."upgrade:mas"]
description = "Upgrade the Mac App Store apps"
run = "sudo mas upgrade"

[tasks."upgrade:brew"]
description = "Upgrade the Homebrew formulae and casks"
run = "brew update && brew upgrade --yes"

[tasks."upgrade:mise"]
description = "Upgrade the tools in the global mise config"
run = "mise upgrade"

[tasks."upgrade:rustup"]
description = "Upgrade rustup and the Rust toolchains"
run = "rustup update"

[tasks."upgrade:ghcup"]
description = "Upgrade ghcup"
run = "ghcup upgrade"

[tasks."upgrade:elan"]
description = "Upgrade elan"
run = "elan self update"

[tasks."upgrade:juliaup"]
description = "Upgrade juliaup and Julia"
run = "juliaup self update && juliaup update"

[tasks."upgrade:opam"]
description = "Upgrade the packages in the current opam switch"
run = "opam update && opam upgrade --yes"

[tasks.gc]
description = "Delete generations and Homebrew downloads older than 7 days, then collect garbage"
run = ["sudo nix-collect-garbage --delete-older-than 7d", "brew cleanup --prune=7"]

[tasks.fmt]
description = "Format all Nix files"
run = "nix fmt"

[tasks.check]
description = "Evaluate the flake outputs"
run = "nix flake check"

[tasks.pre-commit]
description = "Fail if any Nix file is not formatted"
run = "nix fmt -- --ci"

[tasks.vscode-extensions]
description = "Install the VS Code extensions listed in config/vscode/extensions.txt"
run = "xargs -L1 code --install-extension < config/vscode/extensions.txt"
