[tasks.apply]
description = "Build and activate the system configuration"
run = "sudo nix run --inputs-from . nix-darwin -- switch --flake .#mac"

[tasks.build]
description = "Build the system configuration without activating it"
run = "nix run --inputs-from . nix-darwin -- build --flake .#mac"

[tasks.diff]
description = "Show the package changes between the running system and ./result"
run = "nix store diff-closures /run/current-system ./result"

[tasks.update]
description = "Update the flake inputs in flake.lock"
run = "nix flake update"

[tasks.upgrade]
description = "Upgrade everything with topgrade, configured in nix/home/topgrade.nix"
run = "topgrade"

[tasks.lock]
description = "Commit flake.lock and config/nvim/lazy-lock.json if they changed"
run = "git diff --quiet HEAD -- flake.lock config/nvim/lazy-lock.json || git commit -m 'chore: update lock files' -- flake.lock config/nvim/lazy-lock.json"

[tasks."upgrade:nix"]
description = "Update the flake inputs and activate the result; a failing build restores flake.lock"
run = [
  { task = "update" },
  "mise run build || { git restore flake.lock; exit 1; }",
  { task = "diff" },
  { task = "apply" },
]

[tasks.gc]
description = "Delete generations and Homebrew downloads older than 7 days, then collect garbage"
run = [
  "sudo nix-collect-garbage --delete-older-than 7d",
  "brew cleanup --prune=7",
]

[tasks.fmt]
description = "Format all Nix files"
run = "nix fmt"

[tasks.check]
description = "Evaluate the flake outputs"
run = "nix flake check --impure"

[tasks.pre-commit]
description = "Fail if any Nix file is not formatted"
run = "nix fmt -- --ci"
